<!DOCTYPE html>

<html>

    <head>
        <title>Customer Details Form</title>
        <meta charset="UTF-8" />
        <meta name="author" content="Mike Taslakjian" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    </head>

    <body>
        
        <main>
            <h1>Customer Details:</h1>

            <form>
                <fieldset>
                    <legend>Full Name <span>*</span></legend>
                    <div class="flex-inputs">
                        <div class="input-group">
                            <input type="text" id="firstName" name="firstName" required />
                            <label for="firstName">First Name</label>
                        </div>
                        <div class="input-group">
                            <input type="text" id="lastName" name="lastName" required />
                            <label for="lastName">Last Name</label>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Address <span>*</span></legend>
                    <div class="input-group">
                        <input type="text" id="streetAddress" name="streetAddress" required />
                        <label for="streetAddress">Street Address</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="streetAddress2" name="streetAddress2" required />
                        <label for="streetAddress2">Street Address Line 2</label>
                    </div>
                    <div class="flex-inputs">
                        <div class="input-group">
                            <input type="text" id="city" name="city" required />
                            <label for="city">City</label>
                        </div>
                        <div class="input-group">
                            <input type="text" id="stateProvince" name="stateProvince" required />
                            <label for="stateProvince">State / Province</label>
                        </div>
                    </div>
                    <div class="input-group">
                        <input type="text" id="postalZipCode" name="postalZipCode" required />
                        <label for="postalZipCode">Postal / Zip Code</label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Phone Number <span>*</span></legend>
                    <input type="number" name="phoneNumber" placeholder="(000) 000-0000" required />
                </fieldset>

                <fieldset>
                    <legend>E-mail</legend>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="ex: email@yahoo.com" />
                        <label for="email">example@example.com</label>
                    </div>
                </fieldset>

                <hr />

                <fieldset>
                    <legend>How did you hear about us? <span>*</span></legend>
                    <select required>
                        <option value="none">None</option>
                        <option value="newspaper">Newspaper</option>
                        <option value="internet">Internet</option>
                        <option value="magazine">Magazine</option>
                        <option value="other">Other</option>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Feedback about us:</legend>
                    <textarea rows="10"></textarea>
                </fieldset>
            </form>

        </main>

        <script src="script.js"></script>
    </body>

</html>
